services:
  - type: web
    name: alfazal-school-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py migrate --noinput && python manage.py collectstatic --noinput
    startCommand: daphne -b 0.0.0.0 -p $PORT config.asgi:application
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: alfazal-school-api.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: alfazal-school-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: alfazal-school-redis
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false

  - type: web
    name: alfazal-school-web
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false

  - type: keyvalue
    name: alfazal-school-redis
    plan: free
    ipAllowList: []

databases:
  - name: alfazal-school-db
    plan: free
