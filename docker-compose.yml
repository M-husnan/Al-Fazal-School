services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: alfazal_school
      POSTGRES_USER: school_user
      POSTGRES_PASSWORD: school_password
    ports:
      - "5432:5432"
    volumes:
      - school_postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
volumes:
  school_postgres_data:
